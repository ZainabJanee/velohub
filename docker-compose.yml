version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: velohub-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: velohub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - velohub-network

  redis:
    image: redis:7-alpine
    container_name: velohub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - velohub-network

volumes:
  postgres_data:
  redis_data:

networks:
  velohub-network:
    driver: bridge
